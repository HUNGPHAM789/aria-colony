name: Deploy Aria Colony 3D to GitHub Pages

on:
  push:
    branches:
      - threejs-prototype
    paths:
      - "threejs-prototype/**"
      - ".github/workflows/deploy-aria-colony-3d.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aria-colony-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: threejs-prototype
        run: npm install

      - name: Build game
        working-directory: threejs-prototype
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built game
        uses: actions/upload-pages-artifact@v3
        with:
          path: threejs-prototype/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
